<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Kitchen Table">
<meta name="theme-color" content="#1d7a58">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kitchen Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, content scrolls, four tabs pinned at the bottom, sheets slide up for every edit. */
:root{
  --paper:#f3f6f2; --card:#ffffff; --ink:#15211c; --muted:#62716a; --line:#dde5df;
  --accent:#1d7a58; --accent-ink:#ffffff; --accent-soft:#e1f1ea;
  --j:#2f61d4; --j-soft:#e5ecfb; --v:#a8376e; --v-soft:#f9e6ef;
  --warn:#9a5204; --warn-soft:#fdf0dc; --bad:#b3261e;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06);
  --font-display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1511; --card:#17211c; --ink:#eaf1ed; --muted:#93a39b; --line:#263229;
    --accent:#4fc79a; --accent-ink:#07251a; --accent-soft:#16342a;
    --j:#86a9ff; --j-soft:#1b2842; --v:#ee93c0; --v-soft:#3a1d2d;
    --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8f86;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1511; --card:#17211c; --ink:#eaf1ed; --muted:#93a39b; --line:#263229;
  --accent:#4fc79a; --accent-ink:#07251a; --accent-soft:#16342a;
  --j:#86a9ff; --j-soft:#1b2842; --v:#ee93c0; --v-soft:#3a1d2d;
  --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8f86;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
button,a,label,summary,input,select{touch-action:manipulation}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-appearance:none;appearance:none;border-radius:12px}
input[type=time],input[type=date]{min-height:46px;text-align:left}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.app{height:100%;height:100dvh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper)}
.top{padding:calc(env(safe-area-inset-top) + 14px) 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:26px;font-weight:700}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
#view{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 28px;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:500;position:relative;border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:600;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.tab:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,.who:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.banner{border-radius:14px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.j{background:var(--j-soft);color:var(--j)}
.pill.v{background:var(--v-soft);color:var(--v)}
.pill.plain{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:10px 14px;min-height:44px;border-radius:11px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{border:0;background:var(--paper);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}


/* header + week navigator */
#topact{display:flex;align-items:center;gap:8px}
#topact .icon-btn{background:var(--card);border:1px solid var(--line);width:42px;height:42px}
#topact .btn.sm{min-height:42px;border-radius:99px;padding:0 16px}
.wknav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px}
.wknav .icon-btn{background:var(--paper);width:44px;height:44px;font-size:22px}
.wknav .icon-btn[disabled]{opacity:.3;pointer-events:none}
.wk-mid{text-align:center;display:flex;flex-direction:column;gap:1px}
.wk-mid b{font-family:var(--font-display);font-size:18px;font-weight:700}
.wk-mid span{font-size:12.5px;color:var(--muted)}
.day-head .dd8{font-size:15px;color:var(--muted);font-weight:500}
.day-head .pill{margin-left:auto}

/* fridge + morning check */
.mi.fi .qty{flex:none;font-weight:600;font-size:15px;color:var(--ink);background:var(--paper);border-radius:99px;padding:4px 11px}
.pickup{padding:12px 14px}
.pickup .pk{display:flex;flex-direction:column;gap:2px;margin:4px 0 6px}
.pickup .pk small{color:var(--muted,#6b7a72);font-size:13px}
.pickup .pkl{font-size:15px}
.unsure{padding:10px 14px}
.unsure .us{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.unsure .us+.us{border-top:1px dashed var(--line,#dfe5e1)}
.unsure .ut small{display:block;color:var(--muted,#6b7a72);font-size:13px}
.unsure .ub{display:flex;gap:6px;flex:none}
.mi small .est{color:var(--warn);font-weight:600}
.mi small.mine{font-style:italic;opacity:.7}
.mi.fi.warn small{color:var(--warn);font-weight:600}
.swr{position:relative;overflow:hidden;border-radius:14px}
.swr .mi{position:relative;background:var(--paper);transition:transform .22s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swr.drag .mi{transition:none}
.swr.open .mi{transform:translateX(-96px)}
.swdel{position:absolute;right:0;top:4px;bottom:4px;width:88px;border:0;border-radius:14px;background:var(--bad);color:#fff;font:600 15px var(--font-body)}
.mgroup.soon h3{color:var(--warn)}
button.mcb{width:100%;text-align:left;border:0;display:flex;flex-direction:column;gap:2px;font-family:inherit}
button.mcb span{font-size:13px;opacity:.85}
.mc-t{font-size:24px;margin:2px 0 4px}
.stars{display:flex;gap:6px}
.star{border:0;background:none;font-size:38px;line-height:1;color:var(--line);padding:2px 4px}
.star.on{color:#f0b429}
/* plan */
.range{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 2px}
.range b{font-family:var(--font-display);font-size:17px}
.day{display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.day-head{display:flex;align-items:baseline;gap:8px}
.day-head b{font-family:var(--font-display);font-size:20px;font-weight:700}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who{border:0;text-align:left;border-radius:12px;padding:8px 12px;min-height:52px;display:flex;flex-direction:column;gap:1px;min-width:0}
.who small{font-size:12px;font-weight:600;opacity:.85}
.who span{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.who.j{background:var(--j-soft);color:var(--j)}
.who.v{background:var(--v-soft);color:var(--v)}
.who.need{background:var(--warn-soft);color:var(--warn)}
.who.off{background:var(--card);border:1px dashed var(--line);color:var(--muted)}
.dinner{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.dinner-meta{font-size:14px;color:var(--muted)}
.dinner-meta b{color:var(--ink);font-weight:600}
.pick{width:100%;text-align:left;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px 14px;color:var(--accent);font-weight:600}
.chosen{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chosen .name{font-family:var(--font-display);font-weight:600;font-size:18px;text-align:left;background:none;border:0;padding:0;color:var(--ink);overflow-wrap:anywhere}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.stepper b{min-width:22px;text-align:center}
.card.day.suggest{border:2px dashed var(--accent)}
.note{font-size:13px;border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.good{background:var(--accent-soft);color:var(--accent)}

/* recipes */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.row .t{font-family:var(--font-display);font-size:18px;font-weight:600;overflow-wrap:anywhere}
.row .m .pill{font-size:11.5px;padding:1px 8px}
.row{gap:5px;padding:11px 14px}
.row .m{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:36px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{font-size:20px}
.fab{position:sticky;bottom:8px;display:flex;justify-content:flex-end;padding-top:12px}
.fab .btn{box-shadow:var(--shadow);border-radius:99px;padding:13px 20px}

/* shop */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:11px 4px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.aisle{display:flex;flex-direction:column;gap:2px}
.aisle h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--font-body);font-weight:600;padding:6px 4px}
details.dd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.dd summary{display:flex;align-items:center;gap:10px;padding:14px 0;cursor:pointer;list-style:none;font-family:var(--font-display);font-weight:600;font-size:18px}
details.dd summary::-webkit-details-marker{display:none}
details.dd summary>span:first-child{flex:1}
details.dd .cnt{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted);background:var(--paper);border-radius:999px;padding:2px 10px}
details.dd .clr{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--muted)}
details.dd .chev{color:var(--muted);transition:transform .15s}
details.dd[open] .chev{transform:rotate(180deg)}
details.dd .ddb{padding:0 0 6px;border-top:1px solid var(--line)}
.shop-head{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.shop-head h2{font-size:26px}
.addpill{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:0 6px 0 18px}
.addpill input{flex:1;border:0;background:none;font-size:17px;padding:14px 0;outline:none;min-width:0}
.addpill button{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1}
.mgroup{display:flex;flex-direction:column;margin-top:10px}
.mgroup h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 4px 2px;font-family:var(--font-body)}
.mi{display:flex;align-items:center;gap:14px;padding:10px 0;width:100%;text-align:left;background:none;border:0}
.mi .ico{flex:none;width:52px;height:52px;border-radius:14px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:30px}
.mi .nm{flex:1;min-width:0}
.mi .t{font-size:17px;overflow-wrap:anywhere}
.mi .t b{font-weight:600;margin-right:2px}
.mi .cap{text-transform:capitalize}
.mi .nm small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.mi .cb{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-weight:700}
.mi.done{opacity:.5}
.mi.done .t{text-decoration:line-through}
.mi.done .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.item .box{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:700}
.item .nm{flex:1;min-width:0}
.item .nm b{font-weight:500;overflow-wrap:anywhere}
.item .nm small{display:block;color:var(--muted);font-size:12px}
.item .qty{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);white-space:nowrap}
.item.done{opacity:.55}
.item.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.done .nm b{text-decoration:line-through}
details.card summary{cursor:pointer;font-weight:600}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}

/* shifts */
.shiftrow{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:stretch;width:100%;border:0;background:none;padding:0;text-align:left}
.shiftrow .d{display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--muted)}
.shiftrow .d b{font-family:var(--font-display);font-size:17px;color:var(--ink)}
.shiftrow.today .d b{color:var(--accent)}
.cell{border-radius:12px;padding:8px 10px;font-size:13px;font-weight:500;min-height:46px;display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere}
.cell.j{background:var(--j-soft);color:var(--j)}
.cell.v{background:var(--v-soft);color:var(--v)}
.cell.off{background:var(--card);color:var(--muted);border:1px dashed var(--line)}
.cell.need{background:var(--warn-soft);color:var(--warn)}
.cell small{font-size:11px;opacity:.85;font-weight:600}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .18s ease-out}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92%;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:rise .22s ease-out}
.sheet.tall{height:92%;height:92dvh}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet-head h2{font-size:21px}
.sheet-body{padding:6px 18px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1 1 auto}
.sheet-foot{padding:10px 18px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);display:flex;gap:8px;background:var(--paper)}
.sheet-foot .btn{flex:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.two input,.two select{width:100%;box-sizing:border-box}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px;font-size:15px}
.sw input{width:26px;height:26px;accent-color:var(--accent)}
.sect{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.sect h3{font-size:17px}
.set-lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 4px -4px}
.set-hd{display:flex;gap:12px;align-items:flex-start}
.set-hd b{display:block;font-family:var(--font-display);font-size:17px}
.set-hd span span{font-size:13px;color:var(--muted)}
.set-hd .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px}
.tri{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.tri .btn{padding:10px 6px;font-size:14px}
.btn.danger{color:#b3261e}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.opt b{display:block;font-family:var(--font-display);font-size:17px}
.opt span{font-size:13px;color:var(--muted)}
.opt .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ing li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cook{display:flex;flex-direction:column;gap:18px;flex:1}
.cook .big{font-family:var(--font-display);font-size:26px;line-height:1.3;font-weight:600}
.cook .n{color:var(--accent);font-weight:700}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;max-width:90%;text-align:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.overlay,.sheet,.spin{animation:none}}

<script>
(function(){
'use strict';

// ===== LOGIC START =====
const DAYMS=864e5;
const pad=n=>String(n).padStart(2,'0');
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return isoOf(new Date());}
function parseISO(iso){const p=iso.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function fromUTC(dt){return dt.getUTCFullYear()+'-'+pad(dt.getUTCMonth()+1)+'-'+pad(dt.getUTCDate());}
function addDays(iso,n){return fromUTC(new Date(parseISO(iso).getTime()+n*DAYMS));}
function dowOf(iso){return parseISO(iso).getUTCDay();}
function mondayMs(iso){const dt=parseISO(iso);return dt.getTime()-((dt.getUTCDay()+6)%7)*DAYMS;}
function mondayISO(iso){return fromUTC(new Date(mondayMs(iso)));}
function fmtDate(iso){const d=parseISO(iso);return DAYN[d.getUTCDay()]+' '+d.getUTCDate()+' '+MONN[d.getUTCMonth()];}
function fmtShort(iso){const d=parseISO(iso);return d.getUTCDate()+' '+MONN[d.getUTCMonth()];}
function mins(t){if(!t)return null;const m=/^(\d{1,2}):(\d{2})$/.exec(t);return m?(+m[1])*60+(+m[2]):null;}
function hm(x){const n=((Math.round(x)%1440)+1440)%1440;return pad(Math.floor(n/60))+':'+pad(n%60);}

const AISLES=['Fruit & veg','Meat & fish','Dairy & eggs','Bakery','Tins & dry goods','Frozen','Sauces & spices','Drinks','Household','Other'];
const AISLE_WORDS=[
 ['Fruit & veg',['green bean','runner bean','bean sprout','sweet potato','spring onion','pak choi']],
 ['Household',['toilet roll','toilet paper','kitchen roll','loo roll','washing up','dishwasher','bin bag','tissues','sponge','bleach','detergent','toothpaste','shampoo','soap']],
 ['Frozen',['frozen','ice cream']],
 ['Tins & dry goods',['tin','tinned','can','canned','pasta','rice','noodle','flour','sugar','lentil','chickpea','bean','oat','couscous','quinoa','stock','passata','coconut milk','puree','breadcrumb','cereal','polenta','spaghetti','penne','fusilli','tagliatelle','lasagne','gnocchi','bulgur','cornflour','tortilla chip','nut','almond','cashew','raisin','dried']],
 ['Sauces & spices',['black pepper','chilli flake','salt','cumin','paprika','turmeric','oregano','cinnamon','curry','garam','masala','soy','vinegar','oil','mustard','ketchup','mayo','mayonnaise','sauce','honey','syrup','stock cube','spice','seasoning','pesto','harissa','tahini','miso','sriracha','worcestershire','bay leaf','nutmeg','cayenne','paste']],
 ['Meat & fish',['chicken','beef','pork','lamb','mince','bacon','sausage','ham','salmon','cod','prawn','tuna','fish','steak','turkey','chorizo','duck','haddock','fillet']],
 ['Dairy & eggs',['milk','cheese','butter','cream','yoghurt','yogurt','egg','mozzarella','parmesan','cheddar','feta','halloumi','creme fraiche','mascarpone','ricotta','paneer']],
 ['Bakery',['bread','bun','wrap','tortilla','pitta','pita','naan','bagel','roll','baguette','sourdough','brioche','muffin']],
 ['Fruit & veg',['onion','garlic','tomato','pepper','chilli','carrot','potato','courgette','aubergine','broccoli','spinach','lettuce','salad','cucumber','mushroom','lemon','lime','apple','banana','avocado','ginger','coriander','parsley','basil','mint','thyme','rosemary','leek','celery','cabbage','kale','pea','corn','squash','pumpkin','herb','berry','orange','beetroot','fennel','asparagus','shallot','radish','rocket','cauliflower','sprout','mango','pineapple','pear','peach','plum']],
 ['Drinks',['wine','beer','juice','water','coffee','tea','cola','soda']],
 ['Household',['foil','kitchen roll','washing','bin bag','cling','baking paper','bag']]
];
const AISLE_RX=AISLE_WORDS.map(function(a){return [a[0],a[1].map(function(w){return new RegExp('\\b'+w+'(e?s)?\\b');})];});
function guessAisle(name){const n=String(name||'').toLowerCase();for(const a of AISLE_RX){for(const rx of a[1]){if(rx.test(n))return a[0];}}return 'Other';}

const UNIT_MAP={g:'g',gram:'g',grams:'g',gr:'g',kg:'kg',kilo:'kg',kilos:'kg',kilogram:'kg',kilograms:'kg',ml:'ml',millilitre:'ml',millilitres:'ml',milliliter:'ml',milliliters:'ml',l:'l',litre:'l',litres:'l',liter:'l',liters:'l',tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',tbsp:'tbsp',tbs:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',cup:'cup',cups:'cup',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',clove:'clove',cloves:'clove',tin:'tin',tins:'tin',can:'can',cans:'can',jar:'jar',jars:'jar',pinch:'pinch',bunch:'bunch',handful:'handful',slice:'slice',slices:'slice',pack:'pack',packet:'pack',sprig:'sprig',sprigs:'sprig',stick:'stick',sticks:'stick'};
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
function numVal(t){
  t=t.trim();let tot=0,m;
  const f=t.match(/[½¼¾⅓⅔⅛]/);
  if(f){tot+=FR[f[0]];t=t.replace(f[0],'').trim();}
  if((m=/^(\d+)\s+(\d+)\/(\d+)$/.exec(t))){return tot+(+m[1])+(+m[2])/(+m[3]);}
  if((m=/^(\d+)\/(\d+)$/.exec(t))){return tot+(+m[1])/(+m[2]);}
  if(t==='')return tot;
  const n=parseFloat(t);return isNaN(n)?tot:tot+n;
}
function parseIng(line){
  let s=String(line||'').replace(/^[\s\-•*·\u2022]+/,'').trim();
  if(!s)return null;
  let q=null,u='';
  const m=s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*/);
  if(m){q=m[2]?Math.max(numVal(m[1]),parseFloat(m[2])):numVal(m[1]);s=s.slice(m[0].length);}
  const um=s.match(/^([A-Za-z]+)\.?(?=\s|$)/);
  if(q!=null&&um&&UNIT_MAP[um[1].toLowerCase()]){u=UNIT_MAP[um[1].toLowerCase()];s=s.slice(um[0].length).trim();}
  s=s.replace(/^of\s+/i,'');
  if(q!=null){
    if(u==='kg'){q*=1000;u='g';}else if(u==='l'){q*=1000;u='ml';}
    else if(u==='oz'){q*=28.35;u='g';}else if(u==='lb'){q*=453.6;u='g';}else if(u==='cup'){q*=240;u='ml';}
    if(u==='g'||u==='ml')q=Math.round(q);else q=Math.round(q*100)/100;
  }
  const ci=s.indexOf(',');
  const name=(ci>=0?s.slice(0,ci):s).trim();
  const note=ci>=0?s.slice(ci+1).trim():'';
  if(!name)return null;
  return {q:q,u:u,n:name,note:note,aisle:guessAisle(name)};
}
function nice(q){
  const r=Math.round(q*100)/100;const w=Math.floor(r+1e-9);const f=r-w;
  const sym=[[.5,'½'],[.25,'¼'],[.75,'¾'],[1/3,'⅓'],[2/3,'⅔']];
  for(const s of sym){if(Math.abs(f-s[0])<.02)return (w?String(w):'')+s[1];}
  return String(r);
}
const uk=function(u){return u==='can'?'tin':(u||'');};
const PLURAL_U={clove:1,tin:1,can:1,jar:1,pack:1,bunch:1,slice:1,sprig:1,stick:1};
function fmtQ(q,u){
  if(q==null)return '';
  if(u==='g'&&q>=1000)return (Math.round(q/10)/100)+' kg';
  if(u==='ml'&&q>=1000)return (Math.round(q/10)/100)+' l';
  if(!u)return nice(q);
  const lbl=PLURAL_U[u]&&q>1?(u==='bunch'?'bunches':u+'s'):u;
  return nice(q)+(u==='g'||u==='ml'?'':' ')+lbl;
}
function ingLine(i){return (i.q!=null?nice(i.q)+(i.u?' '+i.u:'')+' ':'')+i.n+(i.note?', '+i.note:'');}
function ingKey(n){
  let k=String(n||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
  k=k.replace(/\b(fresh|large|small|medium|ripe|chopped|diced|sliced|finely|roughly)\b/g,'').replace(/\s+/g,' ').trim();
  return k.split(' ').map(function(w){
    if(w.length>3&&/ies$/.test(w))return w.slice(0,-3)+'y';
    if(w.length>4&&/oes$/.test(w))return w.slice(0,-2);
    if(w.length>3&&/s$/.test(w)&&!/ss$/.test(w))return w.slice(0,-1);
    return w;}).join(' ');
}

const DEF={
  commute:30,dinnerTime:'18:30',cookBuffer:45,
  vAnchor:'2026-11-23',vAnchorType:'early',vDays:[1,2,3,4,5],
  vEarlyStart:'08:00',vEarlyEnd:'16:30',vLateStart:'11:30',vLateEnd:'20:00',vPacked:true,
  takeaway:true,jFactor:1.3,vFactor:1,jStore:'Sainsbury’s / Lidl / Aldi',vStore:'Tesco',jCommute:30,pickupLead:20,pickupOff:'15:00',pickupDefault:'julian',everyday:'Greek yoghurt, Sourdough, Eggs, Milk',
  staples:'salt, pepper, black pepper, olive oil, vegetable oil, oil, water',
  presets:[
    {id:'pls-fri-early',name:'PLS Friday early',match:'pls, premier league',days:[5],leave:'08:00',ret:'18:00',food:false,away:false},
    {id:'pls-fri-late',name:'PLS Friday late',match:'pls, premier league',days:[5],leave:'16:00',ret:'23:00',food:false,away:false},
    {id:'pls-sat',name:'PLS Saturday',match:'pls, premier league',days:[6],leave:'08:30',ret:'21:00',food:false,away:false},
    {id:'tnt',name:'TNT Sports',match:'tnt, ucl, uel, uecl, champions, europa, conference',days:[2,3,4],leave:'13:00',ret:'23:00',food:false,away:false},
    {id:'ob',name:'OB (overnight)',match:'ob',days:[],leave:'',ret:'',food:true,away:true}
  ]
};
function mergeSettings(doc){
  const s=JSON.parse(JSON.stringify(DEF));
  if(doc){for(const k in doc){if(doc[k]!==undefined&&doc[k]!==null)s[k]=doc[k];}}
  return s;
}

function jOf(S,iso){const sh=S.shifts[iso];return (sh&&sh.julian)?sh.julian:{state:'off'};}
function vOf(S,iso){
  const st=S.settings,sh=S.shifts[iso],ov=sh&&sh.viv;
  const early={state:'work',type:'early',start:st.vEarlyStart,end:st.vEarlyEnd};
  const late={state:'work',type:'late',start:st.vLateStart,end:st.vLateEnd};
  if(ov&&ov.type){
    if(ov.type==='early')return early;
    if(ov.type==='late')return late;
    if(ov.type==='custom')return {state:'work',type:'custom',start:ov.start,end:ov.end};
    if(ov.type==='away')return {state:'away',type:'away'};
    return {state:'off',type:ov.type};
  }
  const jh=sh&&sh.julian;
  if(jh&&jh.state==='off'&&/holiday/i.test(jh.title||''))return {state:'off',type:'holiday'};
  if(!(st.vDays||[]).includes(dowOf(iso)))return {state:'off',type:'off'};
  const wk=Math.round((mondayMs(iso)-mondayMs(st.vAnchor))/(7*DAYMS));
  const even=((wk%2)+2)%2===0;
  const anchorEarly=st.vAnchorType==='early';
  return (even?anchorEarly:!anchorEarly)?early:late;
}
function packedFlags(S,iso){
  const f=packedAuto(S,iso),o=(S.settings.lunchOv||{})[iso];
  if(o){if(typeof o.julian==='boolean')f.julian=o.julian;if(typeof o.viv==='boolean')f.viv=o.viv;}
  return f;
}
function packedAuto(S,iso){
  const J=jOf(S,iso),V=vOf(S,iso);
  return {
    julian:(function(){
      if(J.state!=='work'||J.food)return false;
      const l=mins(J.leave),r=mins(J.ret);
      // needs a packed meal only if out at lunchtime: leaves by 11:30 and not back before 13:00
      return l!=null&&l<=690&&(r==null||r<=l||r>=780);
    })(),
    viv:V.state==='work'&&!!S.settings.vPacked
  };
}
function dayInfo(S,iso){
  const st=S.settings,J=jOf(S,iso),V=vOf(S,iso);
  const jl=mins(J.leave),jr=mins(J.ret);
  const j={state:J.state||'off',leave:J.leave||'',ret:J.ret||'',food:!!J.food,title:J.title||'',retNext:false,needsTimes:false};
  let jHomeAt=0;
  if(j.state==='work'){
    if(jl==null&&jr==null){j.needsTimes=true;jHomeAt=22*60;}
    else if(jr==null){jHomeAt=22*60;}
    else{jHomeAt=(jl!=null&&jr<=jl)?jr+1440:jr;j.retNext=jHomeAt>=1440;}
  }
  const jAtDinner=j.state!=='away';
  const v={state:V.state,type:V.type,start:V.start||'',end:V.end||''};
  const vHomeAt=V.state==='work'?(mins(V.end)==null?17*60:mins(V.end))+st.commute:0;
  const pf=packedFlags(S,iso);
  let cook,cookAt;
  const vAtDinner=V.state!=='away';
  if(!jAtDinner&&!vAtDinner){cook='viv';cookAt=0;}
  else if(!jAtDinner){cook='viv';cookAt=vHomeAt;}
  else if(!vAtDinner){cook='julian';cookAt=jHomeAt;}
  else if(jHomeAt<vHomeAt){cook='julian';cookAt=jHomeAt;}
  else if(jHomeAt>vHomeAt){cook='viv';cookAt=vHomeAt;}
  else{cook='either';cookAt=vHomeAt;}
  const base=mins(st.dinnerTime)||1110;
  let dinnerAt=cookAt<=0?base:Math.max(cookAt+st.cookBuffer,base);
  dinnerAt=Math.ceil(dinnerAt/15)*15;
  const eaters=(vAtDinner?['viv']:[]).concat(jAtDinner?['julian']:[]);
  const nx=packedFlags(S,addDays(iso,1));
  const packedTomorrow=[];
  if(nx.viv&&vAtDinner)packedTomorrow.push('viv');
  if(nx.julian&&jAtDinner)packedTomorrow.push('julian');
  const nl=S.plan[addDays(iso,1)];
  if(nl&&nl.lunch&&nl.lunch.kind==='recipe'&&nl.lunch.rid)packedTomorrow.length=0; // tomorrow's lunch has its own recipe
  const nxJulianLost=nx.julian&&!jAtDinner;
  const portions=eaters.length+packedTomorrow.length;
  const jLate=jAtDinner&&j.state==='work'?(jHomeAt>dinnerAt+60?jHomeAt:0):0;
  const busy=(vHomeAt>=20*60&&jAtDinner&&jHomeAt>=21*60)?(vHomeAt+jHomeAt):0;
  return {iso:iso,j:j,v:v,jHomeAt:jHomeAt,vHomeAt:vHomeAt,cook:cook,dinnerAt:dinnerAt,eaters:eaters,packedToday:pf,packedTomorrow:packedTomorrow,nxJulianLost:nxJulianLost,portions:portions,jLate:jLate,busy:busy};
}
function takeawaySuggestion(S,iso,from){
  if(!S.settings.takeaway)return null;
  const mon=mondayISO(iso);let best=null,score=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),p=S.plan[d];
    if(p&&p.kind==='takeaway')return null;
    if(from&&d<from)continue;
    const inf=dayInfo(S,d);
    let sc=inf.busy;
    if(!sc&&inf.j.state==='work'&&inf.v.state==='work'){if(Math.min(inf.jHomeAt,inf.vHomeAt)>=1110)sc=inf.jHomeAt+inf.vHomeAt;}
    if(sc>score){score=sc;best=d;}
  }
  if(!best)return null;
  const p=S.plan[best];
  if(p&&p.kind)return null;
  return best;
}
function dinnerCovers(S,iso){
  const p=S.plan[iso];
  if(!p||!p.kind)return 'none';
  return p.kind==='recipe'?'recipe':'nocook';
}

function isStaple(name,staples){
  if(/\b(peppers|(red|green|yellow|orange|bell|sweet|roasted|jalapeno|chilli) pepper|water chestnuts?)\b/i.test(String(name||'')))return false;
  const k=ingKey(name);
  return String(staples||'').split(',').map(function(x){return ingKey(x);}).filter(Boolean).some(function(s){
    return k===s||new RegExp('\\b'+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(k);});
}
// ---- Pickup reminder: what's missing for tonight (and tomorrow), who picks it up, and when ----
function fmtMin(m){m=Math.max(0,Math.round(m));return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function pickupPlan(S,today,nowMin){
  const st=S.settings||{},tomorrow=addDays(today,1);
  const flat=function(d){const o={};d.aisles.forEach(function(a){a.items.forEach(function(i){o[i.key]=i;});});return o;};
  const tonightHas=mealsOn(S,today).length>0;
  const A=flat(buildShopping(S,[today])),B=flat(buildShopping(S,[today,tomorrow]));
  const info=dayInfo(S,today);
  const items=[];
  const hideTonight=nowMin!=null&&info.dinnerAt&&nowMin>info.dinnerAt;
  Object.keys(A).forEach(function(k){if(!hideTonight)items.push({name:A[k].name,q:B[k]&&B[k].q!=null?B[k].q:A[k].q,u:A[k].u,when:'tonight'});}); // buy enough for both nights in one go
  Object.keys(B).forEach(function(k){if(!A[k])items.push({name:B[k].name,q:B[k].q,u:B[k].u,when:'tomorrow'});});
  const out={items:items,who:null,at:null,store:'',skip:''};
  if(!items.length)return out;
  let who=info.cook;if(who!=='julian'&&who!=='viv')who=st.pickupDefault==='viv'?'viv':'julian';
  out.who=who;out.store=(who==='viv'?st.vStore:st.jStore)||'';
  const lead=Number(st.pickupLead)>=0?Number(st.pickupLead):20,sh=who==='viv'?vOf(S,today):jOf(S,today);
  let leaveWork=null;
  if(who==='viv'&&sh.state==='work')leaveWork=(mins(sh.end)==null?17*60:mins(sh.end));
  else if(who==='julian'&&sh.state==='work'&&info.jHomeAt)leaveWork=info.jHomeAt-(Number(st.jCommute)>=0?Number(st.jCommute):30);
  if(leaveWork!=null){
    if(leaveWork>=21*60+30){out.skip='late';return out;}
    out.at=Math.max(7*60,leaveWork-lead);
  }else out.at=mins(st.pickupOff)==null?15*60:mins(st.pickupOff);
  return out;
}
function pickupText(P,names){
  const it=P.items||[];
  if(!it.length)return '';
  if(it.length===1){const i=it[0];return i.name+': '+(i.q!=null?fmtQ(i.q,i.u)+' needed':'needed');}
  return it.length+' items needed';
}
function mealWeight(S,iso,slot){
  const st=S.settings||{},jf=Number(st.jFactor)>0?Number(st.jFactor):1.3,vf=Number(st.vFactor)>0?Number(st.vFactor):1;
  const avg=(jf+vf)/2;
  if(slot==='lunch')return avg;
  const inf=dayInfo(S,iso),who=inf.eaters.concat(inf.packedTomorrow);
  if(!who.length)return avg;
  return who.reduce(function(n,w){return n+(w==='julian'?jf:vf);},0)/who.length;
}
function mealsOn(S,iso){
  const p=S.plan[iso],out=[];
  if(!p)return out;

const PN={julian:'Julian',viv:'Viv'};
function jLabel(inf){
  const j=inf.j;
  if(j.state==='off')return {t:'Off'+(j.title?' · '+j.title:''),cls:'off'};
  if(j.state==='away')return {t:'Away overnight'+(j.leave?' · leaves '+j.leave:''),cls:'j'};
  if(j.needsTimes)return {t:'Add times'+(j.title?' · '+j.title:''),cls:'need'};
  return {t:(j.leave||'?')+'–'+(j.ret||'?')+(j.retNext?' (+1)':'')+(j.title?' · '+j.title:''),cls:'j'};
}
function vLabel(inf){
  const v=inf.v;
  if(v.state==='away')return {t:'Away overnight',cls:'v'};
  if(v.state==='off')return {t:v.type==='holiday'?'Holiday':'Off',cls:'off'};
  const nm=v.type==='early'?'Early':v.type==='late'?'Late':'Shift';
  return {t:nm+' '+v.start+'–'+v.end,cls:'v'};
}
function namesOf(a){return a.map(function(x){return PN[x];}).join(' & ');}
function recipeName(id){const r=S.recipes[id];return r?r.name:'Deleted recipe';}
function planBase(){const t=todayISO();return dowOf(t)===1?t:addDays(mondayISO(t),7);}
function planMin(){return dowOf(todayISO())===1?0:-1;}
function planDates(){const t=todayISO(),b=addDays(planBase(),S.planOff*7),a=[];for(let i=0;i<7;i++){const d=addDays(b,i);if(d>=t)a.push(d);}return a;}
function horizonN(){const h=Number(S.shop.horizon);return h>=3&&h<=5?h:5;} // 5 days is the maximum
function horizonDates(){
  const t=todayISO(),n=horizonN();
  const a=[];for(let i=0;i<n;i++)a.push(addDays(t,i));return a;
}
function shopDates(){
  return horizonDates().filter(function(d){return mealsOn(S,d).some(function(m){const p=S.plan[d]||{};return !(m.slot==='lunch'?(p.lunch&&p.lunch.cooked):p.cooked);});});
}
function shoppedDates(){return [];}
function saveShop(patch){
  S.shop=Object.assign({checked:{},extras:[],horizon:5,shopped:{}},S.shop,patch);
  const o={checked:S.shop.checked||{},extras:S.shop.extras||[],horizon:S.shop.horizon,shopped:S.shop.shopped||{},evBought:S.shop.evBought||{},sure:S.shop.sure||{}};

function recordMeal(m,ok,portions,rating){

  const doc=JSON.parse(JSON.stringify(p));delete doc.id;
  if(m.slot==='dinner')doc.cooked=cooked;else if(doc.lunch)doc.lunch.cooked=cooked;
  S.plan[m.date]=Object.assign({id:m.date},doc);
  const r=S.recipes[m.rid];
  if(ok&&r){
    const f=portions*mealWeight(S,m.date,m.slot)/(r.servings||2),res=fridgeConsume(S.fridge.items||[],r.ingredients,f,S.settings.unitEq);
    S.fridge=Object.assign({},S.fridge,{items:res.items,from:S.fridge.from||todayISO()});

}

  +'- qty is a plain number (0.5, not "1/2"), or null if no amount is shown. Do not invent amounts or ingredients that are not in the source.\n'
  +'- Use UK names (courgette, aubergine, coriander, spring onion). name has no preparation words; put those in note (for example "diced").\n'

function importErr(e){
  const c=e&&e.code;

  if(c==='invalid_json'||c==='empty_completion'||c==='refused')return 'Couldn’t read a recipe from that. Try a clearer screenshot, or paste the text.';

function draftFromImport(j){

function rtOf(iso,jul){const sh={};if(jul)sh[iso]={julian:jul};return vOf({settings:S.settings,shifts:sh},iso).type;}
function saveDay(c){
  const d=c.d,iso=c.iso,ov=c.ov,who=c.who;
  const old=S.shifts[iso]||{};
  let julian;
  if(who==='v')julian=old.julian||null;
  else if(d.j==='off')julian={state:'off'};
  else julian={state:d.j,leave:d.leave||'',ret:d.j==='work'?(d.ret||''):'',food:!!d.food,title:d.title||'',preset:d.preset||'',edited:true,src:(old.julian&&old.julian.src)||''};
  let viv=null;
  if(who==='j')viv=old.viv||null;
  else if(d.vt!==rtOf(iso,julian)){viv={type:d.vt};if(d.vt==='custom'){viv.start=d.vs||'09:00';viv.end=d.ve||'17:00';}}
  if(who!=='v'&&d.j==='work'&&!d.leave&&!d.ret){toast('Add the time you leave and the time you’re back.');return;}
  if(who!=='v'&&d.j==='away'&&d.back&&!d.backRet){toast('Add the time you’re home on the last day.');return;}
  const put=function(date,jul,vv){
    const doc={date:date};if(jul)doc.julian=jul;if(vv)doc.viv=vv;
    if((!jul||jul.state==='off')&&!vv)return write('shifts/'+date,null);
    return write('shifts/'+date,doc);
  };
  const jobs=[put(iso,julian,viv)];
  if(who!=='v'&&d.j==='away'&&d.back&&d.back>iso){
    for(let x=addDays(iso,1);x<=d.back&&x<=addDays(iso,30);x=addDays(x,1)){
      const ex=S.shifts[x]||{};
      const jul=(x===d.back)?{state:'work',leave:'',ret:d.backRet||'',food:true,title:d.title||'',edited:true}:{state:'away',leave:'',ret:'',food:true,title:d.title||'',edited:true};
      jobs.push(put(x,jul,ex.viv||null));
    }
  }
  if(who!=='j'&&d.vt==='away'&&d.vback&&d.vback>iso){
    for(let x=addDays(iso,1);x<d.vback&&x<=addDays(iso,30);x=addDays(x,1)){
      const ex=S.shifts[x]||{};
      jobs.push(put(x,ex.julian||null,{type:'away'}));
    }
  }
  closeSheet(ov);
  Promise.all(jobs).then(function(){toast('Saved');});
}

async function fetchFeed(url){
  const u=String(url).trim().replace(/^webcal:/i,'https:');
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw {code:'http',status:r.status};
  return await r.text();
}
async function importFromLink(c,url){
  const u=String(url).trim().replace(/^webcal:/i,'https:');
  c.busy=true;c.diag='';c.link='';c.render();
  let t;
  try{t=await fetchFeed(u);}
  catch(e){
    c.busy=false;c.link=u;
    c.diag=(e&&e.code==='http')?'The calendar server answered with an error ('+e.status+'). Check the link is complete and still valid.':'This browser couldn’t read the link from inside the app. That usually means the calendar server doesn’t allow it. Open the link, copy all the text it shows, and paste that here instead.';
    c.render();return;
  }
  lsSet('kt-ics',u);lsSet('kt-ics-at',String(Date.now()));
  c.busy=false;
  await applyIcs(c,t);
}
async function silentRefresh(){
  const u=lsGet('kt-ics');if(!u)return;
  if(Date.now()-Number(lsGet('kt-ics-at')||0)<3600e3)return;
  try{const t=await fetchFeed(u);lsSet('kt-ics-at',String(Date.now()));await applyIcs({render:function(){}},t);}catch(e){}
}
async function applyIcs(c,text){
  const items=parseICS(text);
  if(!items.length){c.diag=diagnose(text);c.render();return;}
  const today=todayISO();
  const P=S.settings.presets;
  let added=0,kept=0,need=0,removed=0;
  const seen={};
  items.forEach(function(it){seen[it.date]=true;});
  for(const it of items){
    const sh=S.shifts[it.date]||{},ex=sh.julian;
    if(ex&&ex.edited){kept++;continue;}
    const pc=presetCandidates(it.title,dowOf(it.date),P);
    let jul;
    if(pc.matched&&pc.cands.length===1){
      jul=julianFromPreset(pc.cands[0],it.title);
      if(jul.state==='away'&&!seen[addDays(it.date,1)]){jul.state='work';jul.leave='';jul.ret='';jul.food=true;need++;}
    }else{jul={state:'work',leave:'',ret:'',food:false,title:it.title,preset:''};need++;}
    jul.src='ics';
    const doc={date:it.date,julian:jul};if(sh.viv)doc.viv=sh.viv;
    await write('shifts/'+it.date,doc);added++;
  }
  for(const date of Object.keys(S.shifts)){
    const sh=S.shifts[date];
    if(date>=today&&!seen[date]&&sh.julian&&sh.julian.src==='ics'&&!sh.julian.edited){
      if(sh.viv)await write('shifts/'+date,{date:date,viv:sh.viv});else await write('shifts/'+date,null);
      removed++;
    }
  }
  c.res={found:items.length,added:added,kept:kept,need:need,removed:removed};

  'restore-go':function(el){

        if(!r||!r.id||!r.name||!Array.isArray(r.ingredients)||S.recipes[r.id])return;

    if(d&&d.kitchenTable===1&&d.shiftsOnly&&d.shifts&&typeof d.shifts==='object'){
      let added=0,kept=0;

        if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
        const ex=S.shifts[date],v=d.shifts[date];
        if(ex&&ex.julian&&(ex.julian.edited||(ex.julian.state!=='off'&&(ex.julian.leave||ex.julian.ret)))){kept++;return;}
        const off=String(v).charAt(0)==='!',title=off?String(v).slice(1):String(v);

        if(ex&&ex.viv)doc.viv=ex.viv;

      });
      applyBuiltins();persistLocal();document.querySelectorAll('.overlay').forEach(function(o){o.remove();});render(true);
      toast(added+' days added'+(kept?', '+kept+' left as you had them':'')+'. Times filled from your presets where known.');return;
    }
    if(d&&d.kitchenTable===1&&d.fridgeOnly&&Array.isArray(d.fridge)){
      const t=todayISO(),add=[];
      d.fridge.forEach(function(x){
        if(!x||!x.name)return;

    if(!already)recordMeal(m,false,0,0);
    mcFinish(c);
  },
  'shop-finish':function(){
    if(!guardWrite())return;
    const sp=Object.assign({},S.shop.shopped||{});
    const bought=fridgeFromShopping(S,shopDates(),todayISO());
    const evb=Object.assign({},S.shop.evBought||{}),cks=S.shop.checked||{},tdy=todayISO();let items=(S.fridge.items||[]).slice();
    const doneX=(S.shop.extras||[]).filter(function(e){return e.done;});
    if(!bought.length&&!doneX.length&&!everydayList(S).some(function(n){return cks['ev:'+n.toLowerCase()];})){toast('Tick what you bought first.');return;}
    const buyEveryday=function(n){
      evb[n.toLowerCase()]=tdy;
      const old=items.filter(function(f){return nameMatch(f.name,n)>0;})[0];
      items=items.filter(function(f){return nameMatch(f.name,n)===0;});
      bought.push(fridgeRec(n,null,'',undefined,tdy,undefined,old?locOf(old):undefined,true));
    };
    everydayList(S).forEach(function(n){if(cks['ev:'+n.toLowerCase()])buyEveryday(n);});
    // things you added yourself and ticked go into the fridge/pantry too
    doneX.forEach(function(e){
      if(isEveryday(S,e.name)){buyEveryday(everydayList(S).filter(function(n){return nameMatch(n,e.name)>0;})[0]);return;}
      const p=parseIng(e.name);
      bought.push(p?fridgeRec(p.n,p.q,p.u,p.aisle,tdy):fridgeRec(e.name,null,'',undefined,tdy));
    });
    shopDates().forEach(function(d){mealsOn(S,d).forEach(function(m){sp[m.key]=true;});});
    if(bought.length){S.fridge=Object.assign({},S.fridge,{items:addFridgeItems(items,bought,true).items,from:S.fridge.from||todayISO()});persistLocal();}
    saveShop({shopped:sp,checked:{},evBought:evb,sure:{},extras:(S.shop.extras||[]).filter(function(e){return !e.done;})});
    toast(bought.length?'Done. '+bought.length+(bought.length===1?' item':' items')+' added to the fridge.':'Done. Those dinners are marked as shopped for.');
  },
  'shop-reset':function(){
    if(!guardWrite())return;
    const sp=Object.assign({},S.shop.shopped||{});
    shoppedDates().forEach(function(d){mealsOn(S,d).forEach(function(m){delete sp[m.key];});});
    saveShop({shopped:sp});
  },
  'shop-copy':function(){
    const data=buildShopping(S,shopDates()),ck=S.shop.checked||{};
    let t='';data.aisles.forEach(function(a){const o=a.items.filter(function(i){return !ck[i.key];});if(!o.length)return;t+=a.aisle+'\n'+o.map(function(i){return '- '+i.name+(i.q!=null?' ('+fmtQ(i.q,i.u)+')':'');}).join('\n')+'\n\n';});
    (S.shop.extras||[]).filter(function(e){return !e.done;}).forEach(function(e){t+='- '+e.name+'\n';});
    t=t.trim();if(!t){toast('Nothing to copy.');return;}
    const fallback=function(){openSheet({title:'Copy list',body:function(){return '<div class="field"><textarea id="copybox" readonly style="min-height:260px">'+esc(t)+'</textarea></div><div class="note">Select all and copy.</div>';}});};
    try{navigator.clipboard.writeText(t).then(function(){toast('List copied');},fallback);}catch(e){fallback();}
  }
};
(function(){
  const W=96;let g=null,sup=0,wx=0,wt=null;
  function closeAll(except){document.querySelectorAll('.swr.open').forEach(function(r){if(r!==except)r.classList.remove('open');});}
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('.swdel'))return;
    const r=e.target.closest?e.target.closest('.swr'):null;
    if(!r){closeAll();return;}
    closeAll(r);
    g={r:r,row:r.querySelector('.mi'),x:e.clientX,y:e.clientY,base:r.classList.contains('open')?-W:0,lock:null,v:null};
  });
  document.addEventListener('pointermove',function(e){
    if(!g)return;
    const dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(g.lock===null){
      if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
      if(Math.abs(dx)>Math.abs(dy)){g.lock='x';g.r.classList.add('drag');try{g.row.setPointerCapture(e.pointerId);}catch(x){}}
      else{g=null;return;}
    }
    g.v=Math.max(-W-24,Math.min(0,g.base+dx));
    g.row.style.transform='translateX('+g.v+'px)';
  });
  function end(){
    if(!g)return;
    if(g.lock==='x'){
      g.r.classList.remove('drag');g.row.style.transform='';
      g.r.classList.toggle('open',g.v!==null&&g.v<-W/2);
      sup=Date.now();
    }
    g=null;
  }
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
  document.addEventListener('click',function(e){
    const r=e.target.closest?e.target.closest('.swr'):null;
    if(!r||e.target.closest('.swdel'))return;
    if(Date.now()-sup<350){e.stopPropagation();e.preventDefault();return;}
    if(r.classList.contains('open')){r.classList.remove('open');e.stopPropagation();e.preventDefault();}
  },true);
  document.addEventListener('wheel',function(e){
    const r=e.target.closest?e.target.closest('.swr'):null;
    if(!r||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
    e.preventDefault();
    wx+=e.deltaX;clearTimeout(wt);wt=setTimeout(function(){wx=0;},250);
    if(wx>50){closeAll(r);r.classList.add('open');wx=0;}
    else if(wx<-50){r.classList.remove('open');wx=0;}
  },{passive:false});
})();
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('overlay')){e.target.remove();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn){if(el.tagName!=='INPUT')e.preventDefault();fn(el,e);}
});
function onBind(e){
  const el=e.target;
  if(el.id==='fsearch'){if(el.value===S.fq)return;S.fq=el.value;const r=$('#fres');if(r)r.innerHTML=fridgeBody();return;}
  if(el.id==='rsearch'){if(el.value===S.rq)return;S.rq=el.value;const l=$('#rlist');if(l)l.innerHTML=recipeList();return;}
  if(el.id==='pk-q'){const c=ctxOf(el);c.q=el.value;const pos=el.selectionStart;c.render();const n=$('#pk-q',c.ov);if(n){n.focus();n.setSelectionRange(pos,pos);}return;}
  if(el.id==='p-file'&&e.type==='change'){const c=ctxOf(el);if(el.files&&el.files.length)runImport(c,el.files,null);return;}
  if(el.id==='ics-file'&&e.type==='change'){
    const c=ctxOf(el),f=el.files&&el.files[0];if(!f)return;
    f.text().then(function(t){c.text=t;applyIcs(c,t);}).catch(function(){toast('Couldn’t read that file.');});return;
  }
  const path=el.dataset&&el.dataset.bind;if(!path)return;
  const c=ctxOf(el);if(!c||!c.d&&path!=='text')return;
  const v=el.type==='checkbox'?el.checked:el.value;
  if(path==='text'&&!c.d){c.text=v;return;}
  setPath(c.d,path,v);
  if(path==='leave'||path==='ret')c.d.preset='';
}
document.addEventListener('toggle',function(e){const d=e.target;if(d&&d.dataset&&d.dataset.dd){S.ui[d.dataset.dd]=d.open;}},true);
document.addEventListener('input',onBind);
document.addEventListener('change',onBind);
document.addEventListener('focusout',function(){if(pendingRender)setTimeout(function(){const a=document.activeElement;if(!(a&&view.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)))render();},50);});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&layer.lastElementChild)layer.lastElementChild.remove();
  if(e.key==='Enter'&&e.target.id==='extra'){e.preventDefault();ACT['add-extra']();}
});
window.addEventListener('hashchange',function(){const h=location.hash.slice(1);if(TITLES[h]&&h!==S.tab){S.tab=h;render(true);}});

// ---------- start ----------
async function init(){
  const h=location.hash.slice(1);if(TITLES[h])S.tab=h;
  render(true);
  try{
    if(window.claude&&window.claude.use){
      const r=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('sample')]);
      DB=r[0];SAMPLE=r[2];
      const usr=r[1];
      if(usr){try{const w=await usr.can('data.write');if(w===false)S.canWrite=false;}catch(e){}}
      if(SAMPLE){try{SAMPLE_LIM=await SAMPLE.limits();}catch(e){SAMPLE_LIM=null;}}
    }
  }catch(e){}
  if(DB){subscribe();}
  else{
    STANDALONE=true;loadLocal();if(!S.fridge.from){S.fridge.from=todayISO();}{const n0=(S.fridge.items||[]).length;S.fridge.items=fridgeDedupe(S.fridge.items||[]);const nf=fridgeFill(S);if(S.fridge.items.length!==n0||nf)persistLocal();}applyBuiltins();if(!lsGet('kt-hz')){S.shop.horizon=5;lsSet('kt-hz','1');persistLocal();}syStart();
    const k=lsGet('kt-key');
    if(k){SAMPLE=makeApiSample(k);try{SAMPLE_LIM=await SAMPLE.limits();}catch(e){}}
    if(lsGet('kt-probe')===null&&!lsSet('kt-probe','1'))S.noStore=true;
    lsDel('kt-ics');lsDel('kt-ics-at');
    if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
  }
  render(true);
  setTimeout(maybeMorning,1500);setInterval(maybeMorning,10*60*1000);
}
init();
document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(maybeMorning,900);});
})();
